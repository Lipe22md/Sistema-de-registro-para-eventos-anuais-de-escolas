<!-- DOCUMENTO HTML -->
<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">

<!-- CABEÇALHO DO DOCUMENTO -->
<head>
    <link rel="stylesheet" href="/css/css.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="icon" href="/img/logo1-removebg-preview.png" type="image/x-icon">
</head>

<!-- CORPO DA PÁGINA -->
<body>

<!-- CONTAINER DO FORMULÁRIO -->
<div class="container">

    <!-- FORMULÁRIO DE LOGIN -->
    <form class="formulario" th:action="@{/login}" method="post">

        <!-- TOKEN DE SEGURANÇA CSRF -->
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <!-- TÍTULO DO FORMULÁRIO -->
        <h1>Login</h1>

        <!-- MENSAGEM DE ERRO NO LOGIN -->
        <div th:if="${param.error}" style="color: red; margin-bottom: 12px;">
            Email ou senha inválidos.
        </div>

        <!-- MENSAGEM DE LOGOUT -->
        <div th:if="${param.logout}" style="color: green; margin-bottom: 12px;">
            Você saiu do sistema.
        </div>

        <!-- CAMPO EMAIL -->
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Digite seu email" required>

        <!-- CAMPO SENHA -->
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

        <!-- BOTÃO DE ENTRAR -->
        <button type="submit">Entrar</button>

        <!-- LINK PARA CADASTRO -->
        <p class="link-formulario">
            Não possui conta?
            <a href="/cadastro">Criar conta</a>
        </p>
    </form>
</div>

</body>
</html>
