<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <div class="container">

        <form class="formulario"
              id="form-login">

            <h1>Login</h1>

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu email"
                required>

            <label for="senha">
                Senha
            </label>

            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Digite sua senha"
                required>

            <button type="submit">
                Entrar
            </button>

            <p class="link-formulario">

                Não possui conta?

                <a href="cadastro.html">
                    Criar conta
                </a>

            </p>

        </form>

    </div>

    <script src="js/main.js"></script>

</body>

</html>
