<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Inscrição</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <div class="container">

        <div class="formulario">

            <h1>Inscrição em Evento</h1>

            <div class="info-evento">

                <h2 id="nome-evento"></h2>

                <p>

                    📅 Data:
                    <span id="data-evento"></span>

                </p>

            </div>

            <form id="form-inscricao">

                <label for="nome">
                    Nome Completo
                </label>

                <input
                    type="text"
                    id="nome"
                    name="nome"
                    placeholder="Digite seu nome completo"
                    required>

                <label for="matricula">
                    Matrícula
                </label>

                <input
                    type="text"
                    id="matricula"
                    name="matricula"
                    placeholder="Digite sua matrícula"
                    required>

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Digite seu email"
                    required>

                <label for="turma">
                    Turma
                </label>

                <input
                    type="text"
                    id="turma"
                    name="turma"
                    placeholder="Ex: 3º Ano A"
                    required>

                <button type="submit">

                    Confirmar Inscrição

                </button>

            </form>

        </div>

    </div>

    <script src="js/main.js"></script>

</body>

</html>
