<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Cadastro</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

    <div class="container">

        <form class="formulario"
              id="form-cadastro">

            <h1>Cadastro</h1>

            <label for="nome">
                Nome Completo
            </label>

            <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Digite seu nome completo"
                required>

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                name="email"
                placeholder="Digite seu email"
                required>

            <label for="telefone">
                Telefone
            </label>

            <input
                type="tel"
                id="telefone"
                name="telefone"
                placeholder="(00) 00000-0000"
                required>

            <label for="senha">
                Senha
            </label>

            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Crie uma senha"
                required>

            <button type="submit">
                Cadastrar
            </button>

            <p class="link-formulario">

                Já possui uma conta?

                <a href="index.html">
                    Fazer login
                </a>

            </p>

        </form>

    </div>

    <script src="js/main.js"></script>

</body>

</html>
