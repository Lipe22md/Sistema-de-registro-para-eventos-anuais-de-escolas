<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <title>Inscrição</title>

    <link rel="stylesheet"
          href="css/style.css">

</head>

<body>

<div class="container">

    <div class="formulario">

        <h1>Inscrição</h1>

        <div class="info-evento">

            <h2 id="nome-evento"></h2>

            <p>
                Data:
                <span id="data-evento"></span>
            </p>

        </div>

        <form id="form-inscricao">

            <input
                type="text"
                id="nome"
                placeholder="Nome Completo"
                required>

            <input
                type="text"
                id="matricula"
                placeholder="Matrícula"
                required>

            <input
                type="email"
                id="email"
                placeholder="Email"
                required>

            <input
                type="text"
                id="turma"
                placeholder="Turma"
                required>

            <button type="submit">

                Confirmar Inscrição

            </button>

        </form>

    </div>

</div>

<script src="js/main.js"></script>

</body>
</html>
